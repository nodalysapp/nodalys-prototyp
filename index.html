<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODALYS – Interaktiver Prototyp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Bungee&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
:root{
 --sand:#EAE1CE; --sand-card:#F4EDDD; --sand-border:#DED2B7;
 --ink:#332E27; --ink-soft:#7A7263; --ink-faint:#A69E8C;
 --blau:#54628F; --rose-l:#C0808A; --rose:#A24756; --gruen-l:#6E8F6E; --gruen:#4B6A4B;
 --lila-l:#8B7FBF; --lila:#6756B0; --gold-l:#D8A657; --gold:#855A16;
 --radius-card:20px; --radius-chip:12px;
 --heading-font:Georgia,'Times New Roman',serif;
 --avatar-font:'Inter',sans-serif;
}
body.stage-jugend{ --radius-card:22px; --radius-chip:13px; --avatar-font:'Bungee',sans-serif; }
body.stage-kids{ --radius-card:28px; --radius-chip:18px; }
*{box-sizing:border-box;}
body{margin:0; background:#DCD3C0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink); display:flex; justify-content:center; padding:24px 12px;}
.device{width:380px; height:760px; background:var(--sand); border-radius:38px; box-shadow:0 24px 50px rgba(0,0,0,.2); overflow:hidden; position:relative; display:flex; flex-direction:column;}
.screen{flex:1; overflow-y:auto; padding:26px 22px 20px; display:flex; flex-direction:column;}
.screen::-webkit-scrollbar{display:none;}
.progress{display:flex; gap:5px; margin-bottom:20px;}
.progress div{flex:1; height:3px; border-radius:2px; background:var(--sand-border);}
.progress div.done{background:var(--blau);}
h1.title{font-family:var(--heading-font); font-weight:normal; font-size:22px; margin:0 0 6px;}
body.stage-kids h1.title{font-family:'Baloo 2',sans-serif; font-weight:700;}
p.sub{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 20px;}
.field{background:var(--sand-card); border:1px solid var(--sand-border); border-radius:var(--radius-chip); padding:14px; font-size:15px; margin-bottom:12px; color:var(--ink);}
.field.placeholder{color:var(--ink-faint);}
.btn{background:var(--blau); color:#fff; border:none; border-radius:var(--radius-chip); padding:14px; font-size:14px; text-align:center; cursor:pointer; margin-top:auto;}
.btn.secondary{background:transparent; border:1.5px solid var(--sand-border); color:var(--ink-soft);}
.btn.off{background:var(--sand-border); color:var(--ink-faint); pointer-events:none;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.btn-row .field{flex:1; min-width:0; margin-bottom:0;}
.pill{display:inline-block; border:1.5px solid var(--sand-border); border-radius:20px; padding:9px 15px; font-size:13px; color:var(--ink-soft); margin:0 6px 8px 0; cursor:pointer; background:var(--sand-card);}
.pill.sel{background:var(--blau); border-color:var(--blau); color:#fff;}
.card{background:var(--sand-card); border:1px solid var(--sand-border); border-radius:var(--radius-card); padding:15px; margin-bottom:12px;}
.card-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:9px; display:flex; justify-content:space-between; align-items:center;}
.tiles{display:flex; gap:6px;}
.tile{flex:1; aspect-ratio:1; border-radius:var(--radius-chip); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; cursor:pointer; background:var(--sand); color:var(--ink-faint); border:1px solid var(--sand-border);}
body.stage-kids .tile.sel{border-radius:40% 60% 55% 45%/50% 45% 55% 50%;}
.tile.sel{color:#fff; border:none;}
.anchors{display:flex; justify-content:space-between; font-size:9.5px; color:var(--ink-faint); margin-top:5px;}
.check-row{display:flex; gap:10px; align-items:flex-start; background:var(--sand-card); border:1px solid var(--sand-border); border-radius:14px; padding:12px; margin-bottom:12px; cursor:pointer;}
.check-row input{margin-top:2px;}
.check-row p{font-size:11.5px; margin:0; line-height:1.5;}
.banner{background:#F1DEE0; border:1.5px solid var(--rose); border-radius:14px; padding:12px; font-size:11.5px; color:var(--ink); line-height:1.5; margin-bottom:10px;}
.disclaimer{font-size:9.5px; color:var(--ink-faint); text-align:center; margin-top:10px;}
.header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.avatar{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--avatar-font); font-size:15px; font-weight:600; flex-shrink:0;}
.langtag{font-size:10px; color:var(--ink-soft); border:1px solid var(--sand-border); border-radius:20px; padding:3px 9px; cursor:pointer;}
.langtag b{color:var(--ink);}
.navbar{display:flex; justify-content:space-around; padding:12px 0 6px; border-top:1px solid var(--sand-border); background:var(--sand);}
.navitem{text-align:center; font-size:10px; color:var(--ink-faint); cursor:pointer;}
.navitem.active{color:var(--blau);}
.navitem svg{display:block; margin:0 auto 4px;}
.toggle{display:flex; background:var(--sand-card); border-radius:16px; padding:3px; margin-bottom:12px;}
.toggle span{flex:1; text-align:center; padding:7px 2px; font-size:10.5px; border-radius:13px; color:var(--ink-soft); cursor:pointer;}
.toggle span.on{background:var(--blau); color:#fff;}
.legend{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px;}
.legend span{display:flex; align-items:center; gap:5px; font-size:10px; color:var(--ink-soft); background:var(--sand); border-radius:12px; padding:4px 8px;}
.legend .dot{width:8px; height:8px; border-radius:50%;}
.menurow{display:flex; justify-content:space-between; align-items:center; padding:12px 2px; border-bottom:1px solid var(--sand-border); font-size:13px; cursor:pointer;}
.stepper{display:flex; align-items:center; gap:14px; justify-content:center; font-size:16px; margin:14px 0;}
.stepperbtn{width:28px; height:28px; border-radius:50%; background:var(--sand); border:1px solid var(--sand-border); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;}
.reset-note{font-size:10px; color:var(--ink-faint); text-align:center; position:absolute; bottom:6px; width:100%; left:0;}
.dev-reset{position:fixed; top:8px; right:8px; font-size:10px; color:var(--ink-soft); background:#fff; border:1px solid var(--sand-border); border-radius:8px; padding:4px 8px; cursor:pointer;}
</style>
</head>
<body class="stage-erwachsen">
<div id="app"></div>
<div class="dev-reset" onclick="location.reload()">Prototyp neu starten</div>
<script>
/* ============================================================
  NODALYS – interaktiver Prototyp
  Deckt ab: gemeinsamer Stamm, Erwachsene/Jugendlich-Onboarding (voll),
  Eltern-Proxy- und Kind-Self-Report-Onboarding (kondensiert, gleiche
  Inhalte wie im Masterprompt aber weniger Einzelschritte),
  Hauptbereich Heute/Insights/Einstellungen je Stufe.
  Alles rein clientseitig, kein Server, keine echten Daten.
  ============================================================ */

const ICONS = {
 target: '<svg width="22" height="22" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="16" cy="16" r="4.5" fill="currentColor"/></svg>',
 bolt: '<svg width="22" height="22" viewBox="0 0 32 32"><path d="M18 3 8 18h7l-2 11 12-16h-7z" fill="currentColor"/></svg>',
 book: '<svg width="22" height="22" viewBox="0 0 32 32"><path d="M16 8c-2-2-6-3-10-2v16c4-1 8 0 10 2 2-2 6-3 10-2V6c-4-1-8 0-10 2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>',
 home: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',
 bars: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="14" width="4" height="6" rx="1"/></svg>',
 wrench: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>',
 check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
 lock: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 feelHead: (fill) => `<svg width="26" height="26" viewBox="0 0 72 72"><path d="M36 4C48 4 57 13 57 24c0 3 2 4 4 7 1 2-1 4-3 4-1 3-3 5-5 7 1 2 0 4-2 5l2 17H15L15 40c-7-3-11-10-11-16C4 12 18 4 36 4Z" fill="${fill}"/><circle cx="30" cy="24" r="6" fill="#F0C34E"/><ellipse cx="34" cy="30" rx="12" ry="8" fill="#4A9BB0"/></svg>`,
};

const MEDS_LIST = ['Methylphenidat','Lisdexamfetamin','Dexamfetamin','Atomoxetin','Guanfacin','Clonidin','Bupropion','Anderes (Freitext)'];
const STAGE_COLOR = { erwachsen: 'var(--blau)', jugend: '', kids: 'var(--blau)' };

const S = {
 screen: 'splash',
 lang: 'de',
 darkmode: false,
 history: [],
 today: {}, // NEU: merkt sich die getippte Kachel je Modul, z.B. {Konzentration: 3}
 todayMeds: {}, // NEU: merkt sich pro Medikament, ob heute genommen
 p: { // profile
   name: '', birthdate: '', ageYears: null, stage: null,
   gender: '', genderIdentity: '', height: '', weight: '',
   reason: '', medStatus: '', medications: [],
   cycleOptIn: '', hormonalStatus: '',
   healthSync: false,
   tracking: ['Konzentration', 'Stimmung', 'Energie'],
   reminders: { med: true, evening: false },
   avatarColor: '#54628F',
   childName: '', parentName: '', parentEmail: '',
   branchChoice: '', // 'proxy' | 'self'
 }
};

function computeStage(years) {
 if (years === null) return 'erwachsen'; // 16+ self-certified
 if (years >= 16) return 'erwachsen';
 if (years >= 13) return 'jugend';
 if (years >= 6) return 'kind-or-proxy'; // needs branch
 if (years >= 4) return 'proxy-only'; // needs 2-way branch
 return 'erwachsen'; // fallback, shouldn't happen
}

function setBodyStage(stage) {
 document.body.className = 'stage-' + (stage === 'jugend' ? 'jugend' : (stage === 'kids' ? 'kids' : 'erwachsen'));
}

function go(screenId) {
 S.history.push(S.screen);
 S.screen = screenId;
 render();
}
function back() {
 S.screen = S.history.pop() || 'splash';
 render();
}

function fmtDate(d) {
 if (!d) return '';
 const [y,m,day] = d.split('-');
 return `${day}.${m}.${y}`;
}

function ageFromBirthdate(d) {
 const bd = new Date(d);
 const today = new Date();
 let age = today.getFullYear() - bd.getFullYear();
 const m = today.getMonth() - bd.getMonth();
 if (m < 0 || (m === 0 && today.getDate() < bd.getDate())) age--;
 return age;
}

/* ---------------- render engine ---------------- */
function render() {
 const app = document.getElementById('app');
 const stageForBody = (S.p.stage === 'jugend') ? 'jugend' : (['kind','proxy'].includes(S.p.stage) ? 'kids' : 'erwachsen');
 setBodyStage(stageForBody);
 const html = SCREENS[S.screen] ? SCREENS[S.screen]() : `<div class="screen">Unbekannter Screen: ${S.screen}</div>`;
 app.innerHTML = `<div class="device">${html}</div>`;
}

document.addEventListener('DOMContentLoaded', render);

/* ---------------- helper UI builders ---------------- */
function progressBar(step, total) {
 let dots = '';
 for (let i = 0; i < total; i++) dots += `<div class="${i < step ? 'done' : ''}"></div>`;
 return `<div class="progress">${dots}</div>`;
}
function tileRow(name, options, selectedIdx, onSelect, color) {
 return `<div class="tiles">${options.map((o,i) => `<div class="tile ${i===selectedIdx?'sel':''}" style="${i===selectedIdx?`background:${color};`:''}" onclick="${onSelect}('${name}', ${i})">${o}</div>`).join('')}</div>`;
}
function pill(label, selected, onclick) {
 return `<span class="pill ${selected?'sel':''}" onclick="${onclick}">${label}</span>`;
}

/* ---------------- SCREENS ---------------- */
const SCREENS = {

splash: () => `
<div class="screen" style="align-items:center; justify-content:center; text-align:center;">
<div style="font-family:var(--heading-font); font-size:30px; letter-spacing:.04em;">NODALYS</div>
<div style="display:flex; gap:6px; margin-top:22px;">
<div style="width:6px;height:6px;border-radius:50%;background:var(--ink-faint);"></div>
<div style="width:6px;height:6px;border-radius:50%;background:var(--ink-soft);"></div>
<div style="width:6px;height:6px;border-radius:50%;background:var(--ink);"></div>
</div>
<div class="btn" style="margin-top:40px;" onclick="go('welcome')">(Weiter zum Prototyp)</div>
</div>`,

welcome: () => `
<div class="screen">
<div style="display:flex; justify-content:flex-end;">
<span class="langtag" onclick="S.lang = S.lang==='de'?'en':'de'; render();"><b>${S.lang.toUpperCase()}</b>/${S.lang==='de'?'EN':'DE'}</span>
</div>
<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
<div style="font-family:var(--heading-font); font-size:26px; margin-bottom:8px;">NODALYS</div>
<div style="font-size:13px; color:var(--blau); font-weight:600; margin-bottom:12px;">100% Lokal &amp; Privat</div>
<p class="sub" style="max-width:230px; margin:0 auto;">Verstehe deine eigenen Muster — Fokus, Stimmung, Energie und mehr — ganz ohne Bewertung. Alle Daten bleiben auf deinem Gerät.</p>
</div>
<div class="btn" onclick="go('birthdate')">Los geht's</div>
<div class="disclaimer">NODALYS ist kein Medizinprodukt und ersetzt keine ärztliche Beratung.</div>
</div>`,

birthdate: () => `
<div class="screen">
   ${progressBar(1,6)}
<h1 class="title">Wann bist du geboren?</h1>
<p class="sub">Das hilft uns, die App altersgerecht anzupassen.</p>
<input type="date" id="bdInput" class="field" style="width:100%;" value="${S.p.birthdate}" onchange="S.p.birthdate=this.value; updateBdBtn();">
<div class="check-row" onclick="toggleTruth()">
<input type="checkbox" id="truthCheck">
<p>Ich bestätige, dass diese Angabe stimmt.</p>
</div>
<div class="btn off" id="bdNextBtn" onclick="handleBirthdateNext()">Weiter</div>
<div style="margin-top:22px; padding-top:14px; border-top:1px dashed var(--sand-border);">
<div style="font-size:10px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;">Alternative: Geburtsdatum weglassen</div>
<div class="check-row" onclick="toggleAdult()">
<input type="checkbox" id="adultCheck">
<p>Ich bin mindestens 16 Jahre alt.</p>
</div>
<div class="btn secondary" onclick="skipBirthdate()">Ohne Geburtsdatum fortfahren</div>
</div>
</div>`,

branch_2opt: () => `
<div class="screen">
<h1 class="title">Für wen richten wir das ein?</h1>
<p class="sub">Das eingegebene Geburtsdatum deutet auf ein junges Kind hin.</p>
<div class="card" style="cursor:pointer; border:2px solid var(--blau); background:#DCE1EE;" onclick="S.p.branchChoice='proxy'; S.p.stage='proxy'; go('proxy_intro')">
<div style="font-family:var(--heading-font); font-size:15px;">Für mein Kind</div>
<div style="font-size:11.5px; color:var(--ink-soft);">Ich trage die Daten für mein Kind ein</div>
</div>
<div class="card" style="cursor:pointer;" onclick="go('birthdate')">
<div style="font-family:var(--heading-font); font-size:15px;">Ich habe mich vertippt</div>
<div style="font-size:11.5px; color:var(--ink-soft);">Zurück zur Geburtsdatum-Eingabe</div>
</div>
</div>`,

branch_3opt: () => `
<div class="screen">
<h1 class="title">Für wen richten wir das ein?</h1>
<p class="sub">Ab diesem Alter kann dein Kind auch selbst eintragen.</p>
<div class="card" style="cursor:pointer; border:2px solid var(--blau); background:#DCE1EE;" onclick="S.p.branchChoice='proxy'; S.p.stage='proxy'; go('proxy_intro')">
<div style="font-family:var(--heading-font); font-size:15px;">Ich trage für mein Kind ein</div>
<div style="font-size:11.5px; color:var(--ink-soft);">Eltern-Ansicht — ich fülle das aus</div>
</div>
<div class="card" style="cursor:pointer;" onclick="S.p.branchChoice='self'; S.p.stage='kind'; go('kind_name')">
<div style="font-family:var(--heading-font); font-size:15px;">Ich bin's selbst, das Kind</div>
<div style="font-size:11.5px; color:var(--ink-soft);">Ich trage meine Sachen selbst ein</div>
</div>
<div class="card" style="cursor:pointer;" onclick="go('birthdate')">
<div style="font-family:var(--heading-font); font-size:15px;">Ich habe mich vertippt</div>
<div style="font-size:11.5px; color:var(--ink-soft);">Zurück zur Geburtsdatum-Eingabe</div>
</div>
</div>`,

};

/* ---------------- birthdate logic ---------------- */
function updateBdBtn() {
 const truth = document.getElementById('truthCheck')?.checked;
 const btn = document.getElementById('bdNextBtn');
 if (btn) btn.className = (S.p.birthdate && truth) ? 'btn' : 'btn off';
}
function toggleTruth() {
 const c = document.getElementById('truthCheck');
 c.checked = !c.checked;
 updateBdBtn();
}
function toggleAdult() {
 const c = document.getElementById('adultCheck');
 c.checked = !c.checked;
}
function skipBirthdate() {
 if (!document.getElementById('adultCheck')?.checked) return;
 S.p.ageYears = null;
 S.p.stage = 'erwachsen';
 go('a_name');
}
function handleBirthdateNext() {
 if (!S.p.birthdate) return;
 const age = ageFromBirthdate(S.p.birthdate);
 S.p.ageYears = age;
 if (age >= 13) {
   S.p.stage = age >= 16 ? 'erwachsen' : 'jugend';
   go('a_name');
 } else if (age >= 6) {
   go('branch_3opt');
 } else if (age >= 4) {
   go('branch_2opt');
 } else {
   alert('Für unter 4-Jährige ist noch kein Ablauf definiert (siehe AD).');
 }
}

/* ---------------- Erwachsene & Jugendliche onboarding ---------------- */
Object.assign(SCREENS, {

a_name: () => `
<div class="screen">
   ${progressBar(2,10)}
<h1 class="title">Wie heißt du?</h1>
<p class="sub">Dein Name bleibt privat und nur auf diesem Gerät.</p>
<input class="field" style="width:100%;" placeholder="Vorname" value="${S.p.name}" onchange="S.p.name=this.value">
<div class="btn" onclick="go('a_gender')">Weiter</div>
</div>`,

a_gender: () => `
<div class="screen">
   ${progressBar(3,10)}
<h1 class="title">Ein paar Angaben zu dir</h1>
<p class="sub">Für passendere Module — z. B. Zyklus nur, wenn relevant.</p>
<div class="card-label" style="margin-bottom:8px;">Biologisches Geschlecht</div>
<div style="margin-bottom:16px;">
     ${['Weiblich','Männlich','Divers','Keine Angabe'].map(g=>`<div class="card" style="cursor:pointer; padding:12px 15px; margin-bottom:8px; ${S.p.gender===g?'border:2px solid var(--blau); background:#DCE1EE;':''}" onclick="setGender('${g}')">${g}</div>`).join('')}
</div>
<div class="card-label" style="margin-bottom:8px;">Größe &amp; Gewicht (optional)</div>
<div class="btn-row" style="margin-bottom:16px;">
<input class="field" placeholder="cm" onchange="S.p.height=this.value">
<input class="field" placeholder="kg" onchange="S.p.weight=this.value">
</div>
<div class="btn" onclick="go('a_reason')">Weiter</div>
</div>`,

a_reason: () => `
<div class="screen">
   ${progressBar(4,10)}
<h1 class="title">Warum nutzt du NODALYS?</h1>
<p class="sub">Hilft uns, die Voreinstellungen sinnvoll zu setzen.</p>
   ${['Ich habe ADHS','Ich vermute ADHS','Ich befinde mich in Abklärung','Ich möchte meine Muster allgemein verstehen'].map(r=>`
<div class="card" style="cursor:pointer; ${S.p.reason===r?'border:2px solid var(--blau); background:#DCE1EE;':''}" onclick="S.p.reason='${r}'; go('a_medq')">${r}</div>
   `).join('')}
</div>`,

a_medq: () => `
<div class="screen">
   ${progressBar(5,10)}
<h1 class="title">${S.p.reason==='Ich habe ADHS' ? 'Nutzt du ADHS-Medikamente?' : 'Nimmst du Medikamente?'}</h1>
   ${['Ja','Nein','Manchmal'].map(o=>`
<div class="card" style="cursor:pointer; ${S.p.medStatus===o?'border:2px solid var(--blau); background:#DCE1EE;':''}" onclick="S.p.medStatus='${o}'; ${o==='Nein'?"afterMed()":"go('a_medadd')"}">${o}</div>
   `).join('')}
</div>`,

a_medadd: () => `
<div class="screen">
<h1 class="title">Welches Medikament?</h1>
<p class="sub">Wirkstoff auswählen oder suchen.</p>
<div style="max-height:230px; overflow-y:auto; margin-bottom:12px;">
     ${MEDS_LIST.map(m=>`
<div class="menurow" onclick="addMed('${m}')">${m} ${S.p.medications.some(x=>x.name===m)?ICONS.check:''}</div>
     `).join('')}
</div>
<div class="btn" onclick="afterMed()">Weiter</div>
<div class="btn secondary" style="margin-top:8px;" onclick="afterMed()">Später in den Einstellungen</div>
</div>`,

a_cycle: () => `
<div class="screen">
   ${progressBar(6,10)}
<h1 class="title">Möchtest du deinen Zyklus tracken?</h1>
<p class="sub">Optional, jederzeit später änderbar.</p>
   ${['Ja','Nein','Später'].map(o=>`<div class="card" style="cursor:pointer; ${S.p.cycleOptIn===o?'border:2px solid var(--blau); background:#DCE1EE;':''}" onclick="setCycle('${o}')">${o}</div>`).join('')}
<div class="banner">NODALYS dient nicht der Verhütung und ist kein Verhütungsmittel.</div>

<h1 class="title">Medikamente</h1>
<p class="sub">Dosen hinzufügen oder entfernen.</p>
${S.p.medications.map((med,mi) => `
<div class="card">
<div class="card-label">${med.name}</div>
${med.doses.length ? med.doses.map((d,di) => `
<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:12.5px;">
<span>${d.time} · ${d.mg} mg</span>
<span style="color:var(--rose); cursor:pointer; font-size:11px;" onclick="removeDose(${mi},${di})">Entfernen</span>
</div>`).join('') : `<div style="font-size:11px; color:var(--ink-faint); margin-bottom:6px;">Noch keine Dosis hinterlegt</div>`}
<div style="display:flex; gap:6px; margin-top:8px; align-items:center;">
<input type="time" id="doseTime_${mi}" style="flex:1; padding:8px; border-radius:10px; border:1px solid var(--sand-border); background:var(--sand-card); font-size:12px;">
<input type="number" id="doseMg_${mi}" placeholder="mg" style="width:56px; padding:8px; border-radius:10px; border:1px solid var(--sand-border); background:var(--sand-card); font-size:12px;">
<div class="btn secondary" style="margin:0; padding:8px 12px; font-size:12px; white-space:nowrap;" onclick="addDose(${mi})">+ Dosis</div>
</div>
</div>`).join('')}
<div class="card-label" style="margin-top:4px;">Neues Medikament</div>
<div style="max-height:160px; overflow-y:auto; margin-bottom:12px;">
${MEDS_LIST.map(m=>`
<div class="menurow" onclick="addMed('${m}')">${m} ${S.p.medications.some(x=>x.name===m)?ICONS.check:''}</div>
`).join('')}
</div>
<div class="btn" onclick="go('app_einstellungen')">Fertig</div>
</div>`;
},

});
function selectTile(name, i){ S.today[name] = i; render(); }
function toggleMedTaken(name){ S.todayMeds[name] = !S.todayMeds[name]; render(); }
function addDose(mi){
 const t = document.getElementById('doseTime_'+mi)?.value;
 const mgVal = document.getElementById('doseMg_'+mi)?.value;
 if(!t || !mgVal) return;
 S.p.medications[mi].doses.push({time:t, mg:Number(mgVal)});
 render();
}
function removeDose(mi,di){ S.p.medications[mi].doses.splice(di,1); render(); }
function adjustSleep(delta){ const cur = S.today.sleepHours ?? 7; S.today.sleepHours = Math.max(0, Math.round((cur+delta)*10)/10); render(); }
function toggleSwitch(on){ return `<div style="width:36px;height:20px;border-radius:12px;background:${on?'var(--blau)':'var(--sand-border)'};position:relative;"><div style="width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:${on?'18px':'2px'};"></div></div>`; }
function noop(){}

</script>
</body>
</html>
