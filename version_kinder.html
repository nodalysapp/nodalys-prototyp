<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODALYS – Prototyp (Kinder (Self-Report))</title>
<style>
:root{
  --radius:20px; --radius-sm:12px;
  --sand:#EAE1CE; --sand-card:#F4EDDD; --sand-border:#DED2B7;
  --ink:#332E27; --ink-soft:#7A7263; --ink-faint:#A69E8C;
  --blue:#54628F; --blue-soft:#DCE1EE;
  --red:#C0808A; --red-soft:#F1DEE0;
  --green:#6E8F6E; --green-soft:#DEE7DA;
  --purple:#8B7FBF; --purple-soft:#E4DFF3;
  --gold:#D8A657; --gold-soft:#F1E3C7;
  --font-head:Georgia,'Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
/* Kinder-Interface: eigenständige Farbwelt gemäß Abschnitt 4 – nur Blau und Rot(=Rose) weichen
   von der Erwachsenenversion ab, Sand/Ink/Grün/Lila/Gold sind laut Spec identisch, Gold kommt
   in der Erwachsenenversion überhaupt nicht vor (dort nur Blau/Rose/Grün/Lila). */
body.kids{
  --radius:28px; --radius-sm:18px;
  --blue:#4A9BB0; --blue-soft:#DCEFF0;
  --red:#BC6B5A; --red-soft:#F0DCD3;
}
body.dark{
  --sand:#221F1B; --sand-card:#2B2721; --sand-border:#3A352C;
  --ink:#EDE6D8; --ink-soft:#B5AC9A; --ink-faint:#847C6C;
  --blue-soft:#33394A; --red-soft:#3E2E30; --green-soft:#2C332C; --purple-soft:#332E45; --gold-soft:#3B331F;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:#0f0e0c;display:flex;justify-content:center;align-items:flex-start;padding:24px;min-height:100vh;}
h1,h2,h3,.serif{font-family:var(--font-head);}
.phone{width:400px;max-width:100%;background:var(--sand);border-radius:44px;border:10px solid #111;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;position:relative;color:var(--ink);transition:background .2s,color .2s;}
.statusbar{display:flex;justify-content:space-between;padding:10px 24px 4px;font-size:12px;color:var(--ink);font-weight:600;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 18px;min-height:40px;}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--sand-card);border:1px solid var(--sand-border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.iconbtn:active{transform:scale(.94);}
.langbtn{border:1px solid var(--sand-border);background:var(--sand-card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);letter-spacing:.03em;}
.screen{padding:8px 20px 100px;min-height:560px;max-height:78vh;overflow-y:auto;}
.screen.center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:560px;}
.badge-disclaimer{font-size:11px;color:var(--ink-faint);border:1px solid var(--sand-border);border-radius:999px;padding:6px 12px;display:inline-block;margin-top:10px;}
.card{background:var(--sand-card);border:1px solid var(--sand-border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 8px;font-size:15px;}
.btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:var(--sand);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.btn:active{opacity:.85;}
.btn.secondary{background:transparent;border:1px solid var(--sand-border);color:var(--ink);}
.btn.small{width:auto;padding:8px 14px;font-size:13px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--sand-border);background:var(--sand);color:var(--ink);font-size:14px;font-family:var(--font-body);margin-top:6px;}
label{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-top:10px;}
.pill{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--sand-border);background:var(--sand-card);font-size:13px;margin:4px 6px 0 0;cursor:pointer;color:var(--ink);}
.pill.active{background:var(--ink);color:var(--sand);border-color:var(--ink);}
.pillrow{margin-bottom:10px;}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--sand-border);background:var(--sand-card);margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:14px;font-family:var(--font-body);}
.opt.active{border-color:var(--ink);background:var(--blue-soft);font-weight:700;}
.progress{display:flex;gap:4px;margin:10px 0 18px;}
.progress span{height:4px;flex:1;border-radius:2px;background:var(--sand-border);}
.progress span.done{background:var(--ink);}
.tile-row{display:flex;gap:8px;margin:8px 0 2px;}
.tile{flex:1;aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid var(--sand-border);background:var(--sand);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;font-family:var(--font-head);font-size:16px;color:var(--ink);}
.tile.active{background:var(--ink);color:var(--sand);}
.anchors{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:2px;}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--sand-border);cursor:pointer;}
.rowline:last-child{border-bottom:none;}
.rowline .lab{display:flex;align-items:center;gap:10px;font-size:14px;}
.chev{color:var(--ink-faint);}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--sand-border);position:relative;cursor:pointer;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle .dot{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
.toggle.on .dot{left:21px;}
.qt-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;}
.qt-chip{flex-shrink:0;padding:9px 14px;border-radius:999px;border:1px solid var(--sand-border);background:var(--sand-card);font-size:12px;white-space:nowrap;cursor:pointer;color:var(--ink);}
/* Erwachsenenversion: aktiver Quick-Track-Chip in Ink (kein Gold, Abschnitt 4 kennt dort kein Gold). */
.qt-chip.active{background:var(--ink);color:var(--sand);border-color:var(--ink);}
/* Kinderversion: darf Gold nutzen, das gehört zu ihrer eigenen Palette. */
body.kids .qt-chip.active{background:var(--gold);color:#1c1a16;border-color:var(--gold);}
.bottomnav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--sand-card);border-top:1px solid var(--sand-border);padding:10px 8px calc(10px + env(safe-area-inset-bottom));}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink-faint);font-size:10px;font-weight:700;}
.navitem.active{color:var(--ink);}
.navitem svg{width:22px;height:22px;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:50;}
.modal{background:var(--sand);width:100%;max-height:85%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px;}
.modal h2{margin-top:4px;}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--sand);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1;}
.disc-bottom{position:absolute;bottom:78px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-faint);padding:0 20px;}
.icon{width:26px;height:26px;display:inline-block;vertical-align:middle;}
.mod-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.faq-item{border-bottom:1px solid var(--sand-border);padding:10px 0;}
.faq-q{font-weight:700;font-size:13px;cursor:pointer;}
.faq-a{font-size:13px;color:var(--ink-soft);margin-top:6px;display:none;}
.faq-item.open .faq-a{display:block;}
.chartwrap{background:var(--sand-card);border:1px solid var(--sand-border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.banner{background:var(--red-soft);border:1px solid var(--red);border-radius:var(--radius-sm);padding:12px;font-size:12px;margin-bottom:12px;}
.info-note{font-size:11px;color:var(--ink-faint);background:var(--sand-card);border:1px dashed var(--sand-border);border-radius:var(--radius-sm);padding:10px;margin-top:8px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;}
.calday{aspect-ratio:1;border-radius:8px;background:var(--sand-card);display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;}
.calday.today{border:2px solid var(--ink);}
.calday .dot{width:5px;height:5px;border-radius:50%;background:var(--blue);position:absolute;bottom:4px;}
::-webkit-scrollbar{width:0;height:0;}
</style>

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function computeAgeStage(birthdate){
  if(!birthdate) return null;
  const bd = new Date(birthdate);
  if(isNaN(bd)) return null;
  const now = new Date();
  let age = now.getFullYear() - bd.getFullYear();
  const m = now.getMonth() - bd.getMonth();
  if(m < 0 || (m===0 && now.getDate() < bd.getDate())) age--;
  let stage;
  if(age <= 4) stage = 'stage_4_8';
  else if(age <= 8) stage = 'stage_4_8';
  else if(age <=12) stage = 'stage_9_12';
  else if(age <=15) stage = 'stage_13_15';
  else stage = null; // adult
  return {age, stage};
}

  const i = state.ob.modules.indexOf(id);
  if(i>-1){ state.ob.modules.splice(i,1); render(); return; }
  if(state.ob.modules.length >= 3 && !state.premium){ openModal('paywall'); return; }
  state.ob.modules.push(id); render();

// --- Onboarding step order logic ---
function nextOnboardingStep(cur){
  const ob = state.ob;
  const genderIsMale = ob.gender === 'm';
  const stageInfo = ob.birthdate ? computeAgeStage(ob.birthdate) : null;
  const isYoungestKidsStage = stageInfo && stageInfo.stage === 'stage_4_8';
  switch(cur){
    case 'welcome': return 'name';
    case 'name': return 'profile';
    case 'profile': return state.isMinor ? 'parent' : 'focus';
    case 'parent': return 'focus';
    case 'focus': return 'reason';
    case 'reason': return 'medq';
    case 'medq': return (ob.medStatus==='yes'||ob.medStatus==='sometimes') ? 'medadd' : 'cycle';
    case 'medadd': return 'cycle';
    case 'cycle': {
      const skip = genderIsMale || (IS_KIDS && isYoungestKidsStage);
      return skip ? 'generalhormone' : 'hormonal';
    }
    case 'hormonal': return 'generalhormone';
    case 'generalhormone': return 'health';
    case 'health': return 'reminders';
    case 'reminders': return 'modules';
    case 'modules': return 'finish';
    default: return 'finish';
  }
}
function showCycleStep(){
  const ob = state.ob;
  const stageInfo = ob.birthdate ? computeAgeStage(ob.birthdate) : null;
  const isYoungestKidsStage = stageInfo && stageInfo.stage === 'stage_4_8';
  return ob.gender !== 'm' && !(IS_KIDS && isYoungestKidsStage);
}
function goNextOnboarding(){
  let n = nextOnboardingStep(state.screen);
  // skip cycle if not applicable
  if(n === 'hormonal' && state.ob.cycleOptIn !== 'yes') n = 'generalhormone';
  if(n === 'cycle' && !showCycleStep()) n = 'generalhormone';
  // Kids version (pure kinder, no parent screens): parent step never shown
  if(n === 'parent' && VERSION==='kinder') n='focus';
  state.history.push(state.screen);
  state.screen = n;
  render();
}

    state.isMinor = false; state.ageStage = null;
  }
  if(VERSION === 'kinder'){ state.isMinor = false; } // kinder-only build skips interactive parent flow
  goNextOnboarding();
}

function svgLineChart(seriesList, width, height){
  const pad=20;
  let svg = '<svg viewBox="0 0 '+width+' '+height+'" width="100%" height="'+height+'">';
  svg += '<line x1="'+pad+'" y1="'+(height-pad)+'" x2="'+(width-6)+'" y2="'+(height-pad)+'" stroke="var(--sand-border)" stroke-width="1"/>';
  const dashes = ['0','6,4','2,3','8,3,2,3'];
  const shapes = ['circle','square','triangle','diamond'];
  seriesList.forEach((s, si)=>{
    const vals = s.values;
    const n = vals.length;
    const stepX = (width - pad - 10) / (n-1);
    let d='';
    const pts=[];
    vals.forEach((v,i)=>{
      const x = pad + i*stepX;
      const y = height - pad - v*(height-pad-10);
      pts.push([x,y]);
      d += (i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    });
    svg += '<path d="'+d+'" fill="none" stroke="var(--'+s.color+')" stroke-width="2.5" stroke-dasharray="'+dashes[si%4]+'" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(([x,y])=>{
      const shape = shapes[si%4];
      if(shape==='circle') svg+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--'+s.color+')"/>';
      else if(shape==='square') svg+='<rect x="'+(x-3)+'" y="'+(y-3)+'" width="6" height="6" fill="var(--'+s.color+')"/>';
      else if(shape==='triangle') svg+='<polygon points="'+x+','+(y-4)+' '+(x-4)+','+(y+3)+' '+(x+4)+','+(y+3)+'" fill="var(--'+s.color+')"/>';
      else svg+='<polygon points="'+x+','+(y-4)+' '+(x+4)+','+y+' '+x+','+(y+4)+' '+(x-4)+','+y+'" fill="var(--'+s.color+')"/>';
    });
  });
  svg += '</svg>';
  return svg;
}
function demoSeries(seed, n){
  let v=0.5, arr=[];
  for(let i=0;i<n;i++){ v += (Math.sin(seed+i*1.3)*0.15); v=Math.max(0.08,Math.min(0.95,v)); arr.push(v); }
  return arr;
}

    const todayD = new Date();
    html += '<div class="calgrid">';
    for(let i=0;i<startOffset;i++) html+='<div></div>';
    for(let d=1;d<=daysInMonth;d++){
      const isToday = state.insights.monthOffset===0 && d===todayD.getDate();
      const hasEntry = (d*7)%3===0;
      html += '<div class="calday '+(isToday?'today':'')+'" onclick="openModal(\'daydetail\')">'+d+ (hasEntry?'<span class="dot"></span>':'') +'</div>';
    }
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;">'+
      '<span style="cursor:pointer" onclick="state.insights.monthOffset--;render()">←</span>'+
      '<span>'+now.toLocaleDateString(state.lang==='de'?'de-DE':'en-US',{month:'long',year:'numeric'})+'</span>'+
      '<span style="cursor:pointer" onclick="state.insights.monthOffset++;render()">→</span></div>';
    if(state.insights.monthOffset!==0) html += '<div style="text-align:center;margin-top:6px;font-size:11px;text-decoration:underline;cursor:pointer;" onclick="state.insights.monthOffset=0;render()">'+t('today_jump')+'</div>';
  }
  return html;
}

function renderSettings(){
  let html = renderTopChrome(false)+'<div class="screen">';
  html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">'+
    '<div style="width:56px;height:56px;border-radius:50%;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:22px;color:var(--purple);">'+(state.ob.name? esc(state.ob.name[0].toUpperCase()) : '?')+'</div>'+
    '<div><div style="font-weight:700;font-size:16px;">'+esc(state.ob.name||'–')+'</div>'+
    (!state.premium? '<a style="font-size:12px;color:var(--blue);cursor:pointer;" onclick="openModal(\'premium\')">'+t('settings_unlock_premium')+'</a>':'')+
    '</div></div>';

  const rows = [
    ['profile','settings_profile'],
    ['meds','settings_meds'],
    ['modules','settings_modules'],
  ];
  if(SHOW_PARENT_SCREENS && state.isMinor) rows.push(['parentpin','settings_parentpin'],['proxy','settings_proxy']);
  rows.push(['privacy','settings_privacy'],['display','settings_display'],['notif','settings_notif'],['contact','settings_contact'],['help','settings_help']);
  if(!IS_KIDS) rows.push(['premium','settings_premium']);

  html += '<div class="card" style="padding:4px 14px;">'+rows.map(([id,labelKey])=>
    '<div class="rowline" onclick="openModal(\''+id+'\')"><span class="lab">'+t(labelKey)+'</span><span class="chev">›</span></div>'
  ).join('')+'</div>';

  if(!IS_KIDS){
    html += '<div class="card" style="cursor:pointer;" onclick="openModal(\'kidsteaser\')"><h3>'+t('kids_area_teaser_title')+'</h3><p style="font-size:12px;color:var(--ink-soft);margin:0;">'+t('kids_area_teaser_text')+'</p></div>';
  }

  html += '</div>' + navBar();
  return html;
}

function modalShell(title, bodyHtml){
  return '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="margin:0">'+title+'</h2><div class="iconbtn" onclick="closeModal()">✕</div></div>'+
    bodyHtml+
  '</div></div>';
}

function renderModal(){
  const id = state.activeModal;
  if(!id) return '';
  if(id==='profile'){
    const stageLabel = state.ageStage ? t(state.ageStage) : null;
    return modalShell(t('settings_profile'),
      '<label>'+t('step_name_ph')+'</label><input type="text" value="'+esc(state.ob.name)+'" oninput="state.ob.name=this.value">'+
      '<label>'+t('birthdate_label')+'</label><input type="date" value="'+esc(state.ob.birthdate)+'">'+
      '<label>'+t('height_label')+'</label><input type="number" value="'+esc(state.ob.height)+'">'+
      '<label>'+t('weight_label')+'</label><input type="number" value="'+esc(state.ob.weight)+'">'+
      (stageLabel? '<label>'+t('age_stage_label')+'</label><div class="info-note">'+stageLabel+'</div>':'')+
      (SHOW_PARENT_SCREENS && state.isMinor ? '<label>'+t('parent_name_label')+'</label><div class="info-note">'+esc(state.ob.parentName||'–')+' · '+(state.ob.parentConsent?(state.lang==='de'?'Einwilligung erteilt':'Consent given'):'–')+'</div><button class="btn secondary" style="margin-top:10px" onclick="revokeConsent()">'+t('revoke_consent')+'</button><div class="info-note" style="margin-top:8px">'+t('parent_proto_note')+'</div>' : '')+
      '<div style="margin-top:16px"><button class="btn" onclick="toast(t(\'saved\'));closeModal()">'+t('confirm')+'</button></div>'
    );
  }
  if(id==='meds'){
    return modalShell(t('settings_meds'),
      (state.ob.meds.length? state.ob.meds.map((m,i)=>'<div class="rowline"><span class="lab">'+icon('pill','blue')+' '+esc(m.name)+' '+esc(m.dose)+'</span><span class="chev" style="cursor:pointer" onclick="state.ob.meds.splice('+i+',1);render()">✕</span></div>').join('') : '<p style="font-size:13px;color:var(--ink-soft)">–</p>')+
      '<div style="margin-top:10px"><button class="btn secondary small" onclick="const n=prompt(\'Wirkstoff?\'); if(n){state.ob.meds.push({name:n,dose:\'\',freq:\'1\'});render();}">+ '+ (state.lang==='de'?'Medikament hinzufügen':'Add medication') +'</button></div>'+
      '<div class="info-note" style="margin-top:10px">'+t('proto_note_meds')+'</div>'
    );
  }
  if(id==='modules'){
    return modalShell(t('settings_modules'),
      '<p style="font-size:12px;color:var(--ink-soft)">'+state.ob.modules.length+'/3 '+(state.premium?'':(state.lang==='de'?'im Basis-Tarif':'in the basic plan'))+'</p>'+
      MODULES.filter(m=> m.id!=='zyklus' || showCycleStep()).map(m=>{
        const active = state.ob.modules.includes(m.id);
        const locked = !active && state.ob.modules.length>=3 && !state.premium;
        const c = moduleColor(m.id);
        return '<div class="rowline" onclick="toggleModule(\''+m.id+'\')"><span class="lab"><span class="mod-icon" style="background:var(--'+c+'-soft)">'+icon(m.icon,c)+'</span>'+moduleLabel(m.id)+'</span>'+ (locked? '<span style="font-size:10px;font-weight:800;'+proBadgeStyle()+'padding:3px 7px;border-radius:6px;">'+t('pro')+'</span>' : '<div class="toggle '+(active?'on':'')+'"><div class="dot"></div></div>') +'</div>';
      }).join('')
    );
  }
  if(id==='parentpin'){
    return modalShell(t('settings_parentpin'),
      '<p style="font-size:13px;color:var(--ink-soft)">'+t('parentpin_intro')+'</p>'+
      '<div class="rowline"><span class="lab">'+t('set_pin')+'</span><span class="chev">'+(state.parentPinSet? '✓' : '›')+'</span></div>'+
      '<button class="btn secondary" style="margin-top:10px" onclick="goto(\'parentpinsetup\');closeModal()">'+t('set_pin')+'</button>'
    );
  }
  if(id==='proxy'){
    return modalShell(t('settings_proxy'),
      '<p style="font-size:13px;color:var(--ink-soft)">'+t('proxy_intro')+'</p>'+
      '<div class="rowline"><span class="lab">'+t('proxy_toggle')+'</span><div class="toggle '+(state.proxyActive?'on':'')+'" onclick="state.proxyActive=!state.proxyActive;render()"><div class="dot"></div></div></div>'
    );
  }
  if(id==='privacy'){
    return modalShell(t('settings_privacy'),
      '<div class="info-note">'+t('privacy_device_only')+'</div>'+
      '<div class="rowline"><span class="lab">'+t('faceid')+'</span><div class="toggle on"><div class="dot"></div></div></div>'+
      '<div class="rowline"><span class="lab">'+t('enc_backup')+'</span><div class="toggle" onclick="this.classList.toggle(\'on\')"><div class="dot"></div></div></div>'+
      '<div class="info-note" style="margin-top:6px">'+t('backup_warning')+'</div>'+
      '<div class="rowline" style="cursor:pointer"><span class="lab">'+t('restore_backup')+'</span><span class="chev">›</span></div>'+
      '<button class="btn secondary" style="margin-top:8px" onclick="premiumGate(\'csv\')">'+t('export_csv')+'</button>'+
      '<button class="btn secondary" style="margin-top:8px;color:var(--red);border-color:var(--red)" onclick="if(confirm(t(\'delete_data\')+\'?\'))toast(t(\'saved\'))">'+t('delete_data')+'</button>'
    );
  }
  if(id==='display'){
    return modalShell(t('settings_display'),
      '<div class="rowline"><span class="lab">'+t('dark_mode')+'</span><div class="toggle '+(state.dark?'on':'')+'" onclick="toggleDark()"><div class="dot"></div></div></div>'+
      '<div class="rowline"><span class="lab">'+t('language')+'</span><span class="chev">'+state.lang.toUpperCase()+'</span></div>'
    );
  }
  if(id==='notif'){
    return modalShell(t('settings_notif'),
      '<div class="rowline"><span class="lab">'+t('rem_med')+'</span><div class="toggle '+(state.ob.remMed?'on':'')+'" onclick="state.ob.remMed=!state.ob.remMed;render()"><div class="dot"></div></div></div>'+
      '<div class="rowline"><span class="lab">'+t('rem_recap')+'</span><div class="toggle '+(state.ob.remRecap?'on':'')+'" onclick="state.ob.remRecap=!state.ob.remRecap;render()"><div class="dot"></div></div></div>'
    );
  }
  if(id==='contact'){
    const faqs=['faq_q1','faq_q2','faq_q3','faq_q4','faq_q5'];
    return modalShell(t('settings_contact'),
      '<p style="font-size:13px">'+t('contact_email')+'</p>'+
      faqs.map((qk,i)=>{
        const ak = qk.replace('_q','_a');
        const open = state.faqOpen[qk];
        return '<div class="faq-item '+(open?'open':'')+'"><div class="faq-q" onclick="state.faqOpen[\''+qk+'\']=!state.faqOpen[\''+qk+'\'];render()">'+t(qk)+'</div><div class="faq-a">'+t(ak)+'</div></div>';
      }).join('')
    );
  }
  if(id==='help'){
    return modalShell(t('settings_help'),
      IS_KIDS ?
      ('<div class="card">'+t('emergency_kummer')+'</div><div class="card">'+t('emergency_eltern')+'</div><div class="card">'+t('emergency_112')+'</div><p style="font-size:11px;color:var(--ink-faint)">'+t('emergency_intl')+'</p>')
      :
      ('<div class="card">'+t('emergency_112')+'</div><div class="card">'+t('emergency_seelsorge')+'</div><p style="font-size:11px;color:var(--ink-faint)">'+t('emergency_intl')+'</p>')
    );
  }
  if(id==='premium'){
    return modalShell(t('premium_title'),
      '<p style="font-weight:700">'+t('premium_price')+'</p>'+
      ['premium_feat1','premium_feat2','premium_feat3','premium_feat4'].map(k=>'<div style="font-size:13px;padding:4px 0;">✦ '+t(k)+'</div>').join('')+
      '<div class="info-note" style="margin-top:8px">'+t('premium_store_note')+'</div>'+
      (state.isMinor? '<div class="info-note" style="margin-top:6px">'+t('pin_required')+'</div>':'')+
      '<div class="rowline" style="margin-top:8px"><span class="lab">'+t('premium_demo_toggle')+'</span><div class="toggle '+(state.premium?'on':'')+'" onclick="state.premium=!state.premium;render()"><div class="dot"></div></div></div>'+
      (state.premium? '<p style="font-size:11px;color:var(--ink-faint)">'+t('range_month')+': '+state.trialLeft+' '+(state.lang==='de'?'Tage Test verbleibend':'trial days left')+'</p>':'')
    );
  }
  if(id==='paywall'){
    return modalShell(t('premium_title'),
      '<p style="font-size:13px;color:var(--ink-soft)">'+t('premium_price')+'</p>'+
      ['premium_feat1','premium_feat2','premium_feat3','premium_feat4'].map(k=>'<div style="font-size:13px;padding:4px 0;">✦ '+t(k)+'</div>').join('')+
      (state.isMinor? '<div class="info-note" style="margin-top:6px">'+t('pin_required')+'</div>':'')+
      '<button class="btn" style="margin-top:12px" onclick="state.premium=true;closeModal()">'+t('premium_demo_toggle')+'</button>'
    );
  }
  if(id==='missed'){
    const days = Array.from({length:5}).map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(i+1));return d;});
    return modalShell(t('missed_days'),
      days.map(d=>'<div class="rowline"><span class="lab">'+d.toLocaleDateString(state.lang==='de'?'de-DE':'en-US',{weekday:'short',day:'2-digit',month:'2-digit'})+'</span><span class="chev" style="cursor:pointer;font-size:12px;text-decoration:underline;" onclick="toast(t(\'saved\'))">'+ (state.lang==='de'?'nachtragen':'log') +'</span></div>').join('')
    );
  }
  if(id==='daydetail'){
    return modalShell(state.lang==='de'?'Tages-Detail':'Day detail',
      '<p style="font-size:13px;color:var(--ink-soft)">'+(state.lang==='de'?'Demo-Einträge dieses Tages.':'Demo entries for this day.')+'</p>'+
      '<div class="rowline"><span class="lab">'+moduleLabel('fokus')+'</span><span>3/5</span></div>'+
      '<div class="rowline"><span class="lab">'+moduleLabel('stimmung')+'</span><span>4/5</span></div>'
    );
  }
  if(id==='pdfpreview' || id==='csvpreview'){
    return modalShell(id==='pdfpreview'? t('export_pdf') : t('export_csv'),
      '<p style="font-size:13px;color:var(--ink-soft)">'+(state.lang==='de'?'Demo-Vorschau des Exports.':'Demo preview of the export.')+'</p>'+
      (id==='pdfpreview' ? '<div class="chartwrap">'+svgLineChart([{color:'blue',values:demoSeries(1,10)},{color:'red',values:demoSeries(4,10)}],300,120)+'</div><p style="font-size:11px;color:var(--ink-faint);font-style:italic;">'+t('pdf_footer')+'</p>' : '<pre style="font-size:11px;background:var(--sand-card);padding:10px;border-radius:8px;overflow-x:auto;">date,focus,mood\\n2026-07-30,3,4\\n2026-07-31,4,4\\n2026-08-01,'+(state.today.fokus||'-')+','+(state.today.stimmung||'-')+'</pre>')+
      '<button class="btn secondary" style="margin-top:10px" onclick="toast(t(\'saved\'))">'+ (state.lang==='de'?'Teilen / Versenden':'Share / send') +'</button>'
    );
  }
  if(id==='kidsteaser'){
    return modalShell(t('kids_area_teaser_title'), '<p style="font-size:13px;color:var(--ink-soft)">'+t('kids_area_teaser_text')+'</p>');
  }
  return '';
}
function revokeConsent(){
  if(confirm(state.lang==='de'?'Einwilligung wirklich widerrufen?':'Really revoke consent?')){
    state.ob.parentConsent=false; toast(t('saved')); closeModal();
  }
}

function toggleDark(){ state.dark=!state.dark; document.body.classList.toggle('dark', state.dark); render(); }
function switchLang(){ state.lang = state.lang==='de'?'en':'de'; render(); }

const OB_RENDERERS = {
  welcome:renderWelcome, name:renderName, profile:renderProfile, parent:renderParent, focus:renderFocus,
  reason:renderReason, medq:renderMedQ, medadd:renderMedAdd, cycle:renderCycle, hormonal:renderHormonal,
  generalhormone:renderGeneralHormone, health:renderHealth, reminders:renderReminders, modules:renderModulesStep,
  finish:renderFinish, parentpinsetup:renderParentPinSetup,
};

function render(){
  let html;
  if(state.screen==='main'){
    const tab = state.mainTab||'today';
    html = tab==='today' ? renderToday() : tab==='insights' ? renderInsights() : renderSettings();
  } else {
    html = (OB_RENDERERS[state.screen]||renderWelcome)();
  }
  html += renderModal();
  document.getElementById('app').innerHTML = html;
}
render();
</script>
</body>
</html>
